services:
  - type: web
    name: discord-dashboard
    env: node
    plan: free
    buildCommand: pnpm install && pnpm db:generate && pnpm --filter dashboard build
    startCommand: pnpm --filter dashboard start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_APPLICATION_ID
        value: 1493217033956102215
      - key: DISCORD_CLIENT_ID
        value: 1493217033956102215
      - key: DISCORD_PUBLIC_KEY
        value: 6aab715b948129ed097548936e917a41c89cc7e2dd400240d9f0e89d1b916cea
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://YOUR-RENDER-URL.onrender.com/api/auth/discord/callback
      - key: DATABASE_URL
        fromDatabase:
          name: discordbot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

  - type: pserv
    name: discord-bot
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter bot build
    startCommand: pnpm --filter bot start
    envVars:
      - key: DISCORD_APPLICATION_ID
        value: 1493217033956102215
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: discordbot-db
          property: connectionString

databases:
  - name: discordbot-db
    plan: free
    databaseName: discordbot
    user: postgres
